<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · Customer Experience Library</title>
<style>
:root {
  --jet: #FF8000; --jet-dark: #F36806; --ink: #1C1C1E; --bg: #F7F8FA; --card: #FFFFFF;
  --line: #E6E2DC; --green: #1E7B4F; --green-bg: #E7F4EC; --amber: #975A16; --amber-bg: #FBF0DC;
  --red: #B3261E; --red-bg: #FBE7E5; --blue: #1D4ED8; --blue-bg: #E7EEFB; --gray: #5B6B6E; --gray-bg: #ECEEEF;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.5; font-size: 15px; }
a { color: var(--jet-dark); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { line-height: 1.18; margin: 0 0 .5rem; letter-spacing: -0.015em; }
h1 { font-size: 1.7rem; font-weight: 900; }
h3 { font-size: 1.05rem; font-weight: 800; }
p { margin: .35rem 0; }
.muted { color: var(--gray); }
.small { font-size: .85rem; }
.topbar { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; background: rgba(255,255,255,.82); -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px); border-bottom: 3px solid var(--jet); padding: .65rem 1.25rem; position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 900; }
.brandmark { background: var(--jet); color: #fff; border-radius: 8px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: .8rem; }
.brandname { font-size: 1.02rem; }
.topbar nav { display: flex; gap: 1rem; flex-wrap: wrap; margin-left: .5rem; }
.topbar nav a { color: var(--ink); font-weight: 600; padding: .25rem .1rem; border-bottom: 3px solid transparent; }
.topbar nav a.on { border-bottom-color: var(--jet); color: var(--jet-dark); }
.userbox { margin-left: auto; display: flex; align-items: center; gap: .5rem; }
.uname { font-weight: 700; }
.linklike { background: none; border: none; color: var(--jet-dark); font: inherit; cursor: pointer; padding: 0; }
.container { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
.footer { text-align: center; color: var(--gray); font-size: .8rem; padding: 1.5rem; }
.pagehead { margin-bottom: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-top: 1rem; }
.card { background: var(--card); border: none; border-radius: 16px; padding: 1rem 1.1rem; margin-bottom: 1rem; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.08); transition: box-shadow .22s ease, transform .22s ease; }
.card:hover { box-shadow: 0 2px 6px rgba(16,24,40,.05), 0 18px 44px rgba(16,24,40,.13); transform: translateY(-2px); }
.card-top { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .4rem; align-items: center; }
.card.empty { grid-column: 1 / -1; text-align: center; }
.excerpt { color: var(--ink); }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: .12rem .6rem; font-size: .74rem; font-weight: 700; white-space: nowrap; }
.b-green { background: var(--green-bg); color: var(--green); }
.b-amber { background: var(--amber-bg); color: var(--amber); }
.b-red { background: var(--red-bg); color: var(--red); }
.b-blue { background: var(--blue-bg); color: var(--blue); }
.b-gray { background: var(--gray-bg); color: var(--gray); }
.b-orange { background: #FFE8D2; color: #B54A00; }
.b-example { background: repeating-linear-gradient(45deg, #FFF4E6, #FFF4E6 6px, #FFE8D2 6px, #FFE8D2 12px); color: #B54A00; }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; margin: .75rem 0; }
.chip, a.chip { display: inline-flex; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: .18rem .7rem; font-size: .8rem; font-weight: 600; }
a.chip.on { background: var(--jet); border-color: var(--jet); color: #fff; }
.chip.static { background: var(--gray-bg); border-color: transparent; color: var(--gray); }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--jet); border: none; border-radius: 10px; color: #fff; font: inherit; font-weight: 600; padding: .5rem 1rem; cursor: pointer; transition: background .18s ease, transform .18s ease, box-shadow .18s ease; box-shadow: 0 1px 2px rgba(255,128,0,.28); }
.btn:hover { background: var(--jet-dark); text-decoration: none; color: #fff; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255,128,0,.35); }
.btn:active { transform: translateY(0) scale(.97); box-shadow: 0 1px 2px rgba(255,128,0,.28); }
.btn-secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn-secondary:hover { background: var(--gray-bg); }
.btn-danger { background: var(--red); }
.btn-danger:hover { background: #99201A; }
.btnrow { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .75rem; align-items: center; }
.inlineform { display: inline-flex; }
.searchbar { display: flex; gap: .5rem; margin-top: .75rem; }
.searchbar input[type="search"] { flex: 1; }
a.chip:hover { background: #ECECF1; border-color: #D8DCE0; }
input, textarea, select { font: inherit; color: var(--ink); border: 1px solid #D8DCE0; border-radius: 10px; padding: .5rem .65rem; width: 100%; background: #fff; transition: border-color .15s ease, box-shadow .15s ease; }
input:focus, textarea:focus, select:focus { outline: none; border-color: #AEB6BC; box-shadow: 0 0 0 4px rgba(60,72,84,.08); }
textarea { resize: vertical; }
.f { margin-bottom: .8rem; }
.f label { display: block; font-weight: 700; font-size: .88rem; margin-bottom: .25rem; }
.req { color: var(--red); }
.hint { color: var(--gray); font-size: .8rem; margin: .2rem 0 0; }
.flash { background: var(--green-bg); color: var(--green); border: 1px solid #BEE0CB; border-radius: 8px; padding: .6rem .8rem; margin: .75rem 0; font-weight: 600; }
.flash.err { background: var(--red-bg); color: var(--red); border-color: #F0C4C1; }
form.stack { margin-top: .75rem; }
.actions .btn { margin-top: .5rem; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .3rem .9rem; margin: .4rem 0; }
.kv dt { font-weight: 700; color: var(--gray); }
.kv dd { margin: 0; }
.checkblock { margin-bottom: 1rem; }
.checkblock h4 { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
table.checklist { width: 100%; border-collapse: collapse; margin-top: .4rem; }
table.checklist td { border-top: 1px solid var(--line); padding: .4rem .5rem; vertical-align: top; font-size: .88rem; }
td.cmark { width: 1.6rem; font-weight: 900; text-align: center; }
tr.c-pass td.cmark { color: var(--green); }
tr.c-warn td.cmark { color: var(--amber); }
tr.c-fail td.cmark { color: var(--red); }
td.clabel { font-weight: 700; width: 34%; }
td.cmsg { color: var(--gray); }
ul.matches { margin: .4rem 0; padding-left: 1.2rem; }
ul.matches li { margin: .25rem 0; }
.authwrap { display: flex; justify-content: center; padding-top: 2rem; }
.authcard { max-width: 460px; width: 100%; }
details { border: 1px solid var(--line); border-radius: 8px; padding: .6rem .8rem; margin: .5rem 0; background: #fff; }
details summary { cursor: pointer; font-weight: 700; }
table.list { width: 100%; border-collapse: collapse; }
table.list th, table.list td { text-align: left; border-top: 1px solid var(--line); padding: .45rem .5rem; font-size: .92rem; vertical-align: top; }
table.list th { color: var(--gray); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.hyp h3 a { color: var(--ink); }
.hyp h3 a:hover { color: var(--jet-dark); }
.feedback { background: var(--red-bg); border: 1px solid #F0C4C1; border-radius: 8px; padding: .7rem .9rem; margin: .75rem 0; }
.feedback strong { color: var(--red); }
.merged-note { background: var(--gray-bg); border-radius: 8px; padding: .7rem .9rem; margin: .75rem 0; }
hr.sep { border: none; border-top: 1px solid var(--line); margin: 1rem 0; }
@media (max-width: 700px) { .topbar { position: static; } .kv { grid-template-columns: 1fr; } }
.chip.warn { background: var(--amber-bg); border-color: #EAD5A8; color: var(--amber); font-weight: 700; }

/* experience flywheel hero */
.hero h2 { margin-bottom: .2rem; }
.hero-grid { display: flex; gap: 1.4rem; flex-wrap: wrap; align-items: center; margin-top: .8rem; }
.hero-wheel { flex: 1 1 560px; min-width: 300px; }
.flycallout { flex: 0 1 330px; border: 1px solid #C9DCE0; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 1px 2px rgba(36,46,48,.08); align-self: center; }
.fc-head { background: #C1DADE; color: #242E30; font-weight: 800; padding: .5rem .95rem; }
.fc-body { margin: 0; padding: .55rem .95rem .7rem 1.9rem; font-size: .9rem; }
.fc-body li { margin: .45rem 0; }
svg.fw { width: 70%; height: auto; display: block; margin: 0 auto; }
a.fw-pill { cursor: pointer; }
a.fw-pill rect { transition: stroke .15s ease, fill .15s ease; }
a.fw-pill:hover rect { stroke: #AEB6BC; }

/* user dropdown menu */
.userbtn { display: inline-flex; align-items: center; gap: .5rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: .32rem .85rem; font: inherit; font-weight: 700; cursor: pointer; }
.userbtn:hover { border-color: #AEB6BC; }
.userbtn .caret { font-size: .68rem; color: var(--gray); transition: transform .15s ease; }
.userbtn[aria-expanded="true"] .caret { transform: rotate(180deg); }
.namedot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.usermenu { position: absolute; right: 0; top: calc(100% + .5rem); min-width: 225px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 32px rgba(36,46,48,.18); padding: .45rem; display: none; z-index: 60; }
.usermenu.open { display: block; animation: menupop .15s ease-out; }
@keyframes menupop { from { opacity: 0; transform: translateY(-5px) scale(.98); } to { opacity: 1; transform: none; } }
.mi { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .55rem .7rem; border-radius: 8px; color: var(--ink); font-weight: 600; text-decoration: none; }
.mi:hover { background: #F2F3F5; color: var(--ink); text-decoration: none; }
.mi.on { background: #FFF9F2; color: var(--jet-dark); }
.mi.needed { background: var(--amber-bg); }
.mi.needed:hover { background: #F5E3C0; }
.usermenu form { margin: 0; }
.usermenu .asbtn { width: 100%; background: none; border: none; text-align: left; font: inherit; cursor: pointer; }
.menu-sep { border-top: 1px solid var(--line); margin: .35rem .2rem; }

/* sub-driver taxonomy rows */
.rowlabel { font-weight: 800; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--gray); align-self: center; margin-right: .35rem; white-space: nowrap; }
.chips.taxonomy { align-items: center; }
.chip.clear { border-style: dashed; color: var(--gray); }
.chip.clear:hover { border-color: var(--red); color: var(--red); }
.chip.leaf { background: var(--gray-bg); border-color: var(--gray); color: var(--ink); cursor: default; }
.chip.leaf.placeholder { background: #fff; border-style: dashed; color: var(--gray); }

/* sub-driver / type dropdown row */
.taxrow { display: flex; gap: .8rem; align-items: flex-end; flex-wrap: wrap; margin: .3rem 0 .9rem; }
.taxform { display: flex; gap: .8rem; flex: 1 1 560px; flex-wrap: wrap; }
.taxpair { flex: 1 1 260px; min-width: 240px; }
.taxpair label { display: block; font-weight: 800; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--gray); margin-bottom: .3rem; }

/* brand as home link */
a.brand.homelink { text-decoration: none; }
a.brand.homelink:hover .brandname { color: var(--jet-dark); }

/* curated leaving-reasons boxes */
.reasonboxes { display: grid; gap: .75rem; margin: .2rem 0 1rem; }
.reasonbox { padding: .85rem 1.05rem; }
.reasonbox p { margin: 0; font-size: .93rem; line-height: 1.6; }
.reasonbox a { font-weight: 700; white-space: nowrap; }

/* leaving-reason windows (three per row) */
.reasonboxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin: .2rem 0 1rem; }
.reasonbox { display: flex; flex-direction: column; }
.reasonbox h3 { margin-bottom: .45rem; }
.reasonbullets { margin: 0; padding-left: 1.15rem; }
.reasonbullets li { margin: .35rem 0; font-size: .9rem; line-height: 1.55; }
sup.cite { font-size: .68em; color: var(--gray); }
.srcnote { border-top: 1px solid var(--line); margin-top: auto; padding-top: .5rem; font-size: .78rem; color: var(--gray); }
.srcnote a { font-weight: 700; margin-right: .25rem; }

/* top-bar search */
.topsearch { display: flex; align-items: center; }
.topsearch input[type="search"] { width: 0; min-width: 0; opacity: 0; padding: .4rem 0; border: 1px solid transparent; background: transparent; border-radius: 10px; transition: width .28s ease, opacity .22s ease, padding .28s ease, border-color .2s ease, box-shadow .2s ease; }
.topsearch.open input[type="search"] { width: 250px; opacity: 1; padding: .5rem .65rem; border-color: #D8DCE0; background: #fff; box-shadow: 0 4px 18px rgba(16,24,40,.10); }
.topsearch input[type="search"]:focus { outline: none; border-color: #AEB6BC; box-shadow: 0 0 0 4px rgba(60,72,84,.08); }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: #fff; border: 1px solid #D8DCE0; border-radius: 50%; color: var(--ink); cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease; flex: 0 0 auto; }
.iconbtn:hover { border-color: #AEB6BC; box-shadow: 0 2px 8px rgba(16,24,40,.08); }

</style>
</head>
